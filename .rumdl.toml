# Markdown conventions enforced by `rumdl check .` and the release gate.

[global]
line-length = 80

[MD012]
# Two blank lines separate top-level sections.
maximum = 2

[MD013]
# Prose wraps at 80 columns; fenced code and tables are exempt.
line-length = 80
code-blocks = false
tables = false

[MD033]
# Stable heading anchors and table-cell line breaks are the only inline HTML.
allowed-elements = ["a", "br"]
