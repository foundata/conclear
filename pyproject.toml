[project]
name = "conclear"
version = "1.0.1"
description = "Build and release OCI container images through digest-bound policy gates"
keywords = [
  "oci",
  "container",
  "image",
  "release",
  "supply-chain",
  "sbom",
  "provenance",
  "sigstore",
  "buildah",
  "podman",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSES/GPL-3.0-or-later.txt"]
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  { name = "foundata GmbH" },
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
maintainers = [
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
requires-python = ">=3.12"
dependencies = [
  "click>=8.2.1",
  "httpx>=0.28.1",
  "jsonschema>=4.25.1",
  "python-ulid>=3.1.0",
  "regex>=2026.9.3",
]

# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",

  # Indication for whom the project is for
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Software Distribution",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",

  # Supported Python versions
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
conclear = "conclear.cli:main"

[project.urls]
Homepage = "https://foundata.com/en/projects/conclear/"
Documentation = "https://foundata.com/en/projects/conclear/#doc"
Repository = "https://foundata.com/en/projects/conclear/#source"
Issues = "https://foundata.com/en/projects/conclear/#issues"
Changelog = "https://foundata.com/en/projects/conclear/#changelog"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "conclear"
module-root = "src"
source-include = [
  "CONTRIBUTING.md",
  "DEVELOPMENT.md",
  "ARCHITECTURE.md",
  "REUSE.toml",
  "docs/**",
  "tests/**",
  "uv.lock",
]
wheel-exclude = ["src/conclear/_development_identity.py"]

[tool.releasing]
repository = "foundata/conclear"
version-files = [
  "pyproject.toml",
  "src/conclear/identity.py",
  "src/conclear/data/implementation.json",
  "src/conclear/data/guide-options.json",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138.15",
  "mypy>=1.17.1",
  "pytest>=9.0.0",
  "pytest-cov>=6.2.1",
  "releasing>=1.0.2,<2",
  "ruff>=0.12.11",
  "rumdl>=0.2.66",
  "types-jsonschema>=4.25.1.20250822",
  "types-regex>=2026.9.3.20260903",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/settings/#lint_select
select = [
  "E4",  # pycodestyle import errors
  "E7",  # pycodestyle statement errors
  "E9",  # pycodestyle runtime errors
  "F",   # Pyflakes
  "I",   # import sorting
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # Ruff-specific rules
  "A",   # flake8-builtins: no shadowing of Python builtins
  "D",   # pydocstyle: docstrings on public modules, classes and functions
  "DTZ", # flake8-datetimez: timezone-aware datetime handling only
  "G",   # flake8-logging-format: lazy logging arguments, no eager formatting
  "LOG", # flake8-logging: correct use of the logging module
  "N",   # pep8-naming: PEP 8 naming conventions
  "PTH", # flake8-use-pathlib: pathlib instead of os.path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D", # tests need no docstrings; their names describe the behavior
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
enable_error_code = ["explicit-override"] # Extends strict mode.
warn_unreachable = true                   # Extends strict mode.

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "-m",
  "unit",
]
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]
markers = [
  "unit: hermetic tests that require no external tools or services",
  "local_integration: opt-in tests using local rootless container tools",
  "emulation: opt-in tests that execute a non-native platform",
  "network: opt-in tests that access disposable remote services",
]

[tool.coverage.run]
branch = true
source = ["conclear"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
